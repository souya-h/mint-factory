<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta name="description" content="__DESC__">
<meta property="og:title" content="__TITLE__">
<meta property="og:description" content="__DESC__">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
__OG_IMAGE__
__ANALYTICS__
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0c0d10; color: #e8e6e1; font: 16px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  main { max-width: 480px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 28px; margin: 0 0 8px; font-weight: 600; }
  p { margin: 0 0 16px; color: #a9a69f; }
  .art { width: 100%; aspect-ratio: 8 / 9; background: #15171c; display: block; margin: 20px 0; }
  .row { display: flex; gap: 8px; margin: 0 0 12px; }
  input { flex: 1; min-width: 0; padding: 12px; background: #15171c; border: 1px solid #2c2f38; color: inherit; font: inherit; border-radius: 6px; }
  button { padding: 12px 16px; border: 1px solid #2c2f38; background: #15171c; color: inherit; font: inherit; border-radius: 6px; cursor: pointer; }
  button.primary { background: #e8e6e1; color: #0c0d10; border-color: #e8e6e1; width: 100%; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid #7fb3ff; outline-offset: 2px; }
  .meta { display: flex; justify-content: space-between; color: #a9a69f; margin: 0 0 12px; }
  .note { color: #a9a69f; font-size: 14px; margin: 0 0 12px; }
  #status { min-height: 24px; margin: 12px 0; color: #a9a69f; overflow-wrap: anywhere; }
  a { color: #7fb3ff; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <p class="note" id="testBanner" hidden style="color:#ffb86b">TEST COPY on Base Sepolia. Test ETH only. Nothing here is the real sale.</p>
  <h1 id="name"></h1>
  <p id="desc"></p>
  <p class="note" id="launchNote" hidden></p>
  <p class="note" id="giftNote" hidden></p>

  <div class="row" id="addressRow" hidden>
    <input id="address" placeholder="0x… wallet address or name.eth" aria-label="Wallet address" autocomplete="off" spellcheck="false">
    <button id="previewBtn">Preview</button>
  </div>

  <img class="art" id="art" alt="Artwork preview">

  <div class="meta"><span id="price"></span><span id="supply"></span></div>
  <button class="primary" id="mintBtn" disabled>Mint opens soon</button>
  <div id="status" role="status"></div>
  <div class="row">
    <button id="againBtn" hidden>Another example</button>
    <button id="saveBtn">Save image</button>
    <button id="shareBtn">Share on X</button>
  </div>
  <p class="note" id="byline" hidden></p>
</main>

<script type="module">
import {
  createPublicClient, createWalletClient, custom, http, parseEther, formatEther, isAddress, getAddress, keccak256, toHex,
} from 'https://esm.sh/viem@__VIEM__';
import { normalize } from 'https://esm.sh/viem@__VIEM__/ens';
import { mainnet, base } from 'https://esm.sh/viem@__VIEM__/chains';

__STATS_JS__

const CFG = __CFG__;
const $ = (id) => document.getElementById(id);
const mode = CFG.project.seedMode;
const chain = {
  id: CFG.chain.id,
  name: CFG.chain.name,
  nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 },
  rpcUrls: { default: { http: [CFG.chain.rpc] } },
  ...(CFG.chain.explorer && { blockExplorers: { default: { name: 'Explorer', url: CFG.chain.explorer } } }),
};
const pub = createPublicClient({ chain, transport: http(CFG.chain.rpc) });
const edition = CFG.deployment && { address: CFG.deployment.edition, abi: CFG.editionAbi };
// Deployed ahead of a planned launch: show it as not open yet until launchAt.
const notYet = Boolean(CFG.project.launchAt) && Date.now() < Date.parse(CFG.project.launchAt);
let shown = null; // address currently drawn (perMinter)

function status(text, link) {
  const el = $('status');
  el.textContent = text;
  if (link) {
    const a = document.createElement('a');
    a.href = link.href;
    a.textContent = link.text;
    a.target = '_blank';
    a.rel = 'noopener';
    el.append(' ', a);
  }
}

async function draw(seed, data) {
  const call = { abi: CFG.rendererAbi, functionName: 'render', args: [seed, data] };
  const svg = CFG.deployment
    ? await pub.readContract({ ...call, address: CFG.deployment.renderer })
    : await pub.readContract({ ...call, code: CFG.rendererBytecode });
  // encodeURIComponent keeps non-Latin text (kanji in the haiku works) intact; btoa would throw.
  $('art').src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

// Takes the last address-like thing in the field, so a new address pasted after an old one still works.
// Accepts any letter case (no checksum check) and ENS names such as name.eth or name.base.eth.
async function readAddress(raw) {
  const text = raw.trim();
  const hashes = text.match(/0x[0-9a-fA-F]{64}/g);
  const addrs = text.replace(/0x[0-9a-fA-F]{64}/g, ' ').match(/0x[0-9a-fA-F]{40}(?![0-9a-fA-F])/g);
  if (addrs) return { address: getAddress(addrs.at(-1).toLowerCase()) };
  if (hashes) return { error: 'That looks like a transaction hash. Hash Haiku reads a wallet address: 0x followed by 40 characters.' };
  const names = text.match(/[a-z0-9-]+(?:\.[a-z0-9-]+)*\.eth/gi);
  if (names) {
    status(`Looking up ${names.at(-1)}…`);
    try {
      const ens = createPublicClient({ chain: mainnet, transport: http() });
      const address = await ens.getEnsAddress({ name: normalize(names.at(-1)) });
      if (address) return { address };
    } catch { /* fall through */ }
    return { error: `${names.at(-1)} does not point to a wallet.` };
  }
  return { error: 'That is not a wallet address. Paste one that starts with 0x (40 characters after it), or a .eth name.' };
}

async function previewAddress(raw) {
  const got = await readAddress(raw);
  if (got.error) return status(got.error);
  const address = got.address;
  $('address').value = address;
  let data = 0n;
  if (CFG.project.stats) {
    status(`Reading ${CFG.statsYear} activity… (busy wallets can take up to 30 seconds)`);
    data = packStats(await fetchStats(address, CFG.statsHosts, CFG.statsYear));
  }
  await draw(BigInt(address), data);
  shown = address;
  history.replaceState(null, '', `?a=${address}`);
  status('');
  return data;
}

// perSeed: a transaction hash on Ethereum or Base. The contract cannot check that it exists,
// so the page does, and shows when it happened.
const isTxHash = (v) => /^0x[0-9a-fA-F]{64}$/.test(v);
let shownTx = null;
async function lookupTx(hash) {
  for (const c of [mainnet, base]) {
    try {
      const client = createPublicClient({ chain: c, transport: http() });
      const tx = await client.getTransaction({ hash });
      const block = await client.getBlock({ blockNumber: tx.blockNumber });
      return { chain: c.name, date: new Date(Number(block.timestamp) * 1000).toISOString().slice(0, 10) };
    } catch { /* try the next chain */ }
  }
  return null;
}
async function previewTx(raw) {
  const hash = (raw.match(/0x[0-9a-fA-F]{64}/g) || []).at(-1) || raw;
  $('address').value = hash;
  if (!isTxHash(hash)) return status('Paste a transaction hash: 0x followed by 64 characters.');
  await draw(BigInt(hash), BigInt(hash));
  shownTx = null;
  history.replaceState(null, '', `?tx=${hash}`);
  status('Looking up the transaction…');
  const found = await lookupTx(hash);
  if (!found) return status('That transaction was not found on Ethereum or Base, so it cannot be minted.');
  let note = `${found.chain} transaction, ${found.date}.`;
  if (edition && (await pub.readContract({ ...edition, functionName: 'seedUsed', args: [BigInt(hash)] }))) {
    note += ' Already claimed by someone else.';
  } else {
    shownTx = hash;
  }
  status(note);
}

async function preview() {
  try {
    if (mode === 'perDay') {
      const day = BigInt(Math.floor(Date.now() / 86400000));
      let seed = 0n;
      if (edition) seed = await pub.readContract({ ...edition, functionName: 'daySeed', args: [day] });
      if (seed === 0n) {
        seed = BigInt(keccak256(toHex(`${CFG.project.slug}:${day}`)));
        status("Preview only: each day's poem is fixed onchain by the first mint once the sale opens, so the minted one will differ.");
      }
      await draw(seed, day);
    } else if (mode === 'perSeed') {
      const tx = new URLSearchParams(location.search).get('tx');
      if (tx) {
        $('address').value = tx;
        await previewTx(tx);
      } else {
        const h = keccak256(toHex(String(Math.random())));
        await draw(BigInt(h), BigInt(h));
        status('A random hash. Paste a real transaction to see its poem.');
      }
    } else if (mode === 'perMinter') {
      const a = new URLSearchParams(location.search).get('a');
      if (a) {
        $('address').value = a;
        await previewAddress(a);
      } else if (CFG.project.stats) {
        await draw(0n, 0n);
      } else {
        await draw(BigInt(keccak256(toHex(String(Math.random())))) >> 96n, 0n);
        status('A random wallet. Enter yours to see your own.');
      }
    } else {
      await draw(BigInt(keccak256(toHex(String(Math.random())))), 0n);
    }
  } catch (e) {
    status(`Preview failed: ${e.shortMessage || e.message}`);
  }
}

const step = parseEther(CFG.project.priceStepEth);
const every = CFG.project.stepEvery;
function priceLabel(p, minted) {
  if (!edition || notYet) {
    // Before launch: the planned starting price and the step rule, never a live price.
    let t = `Launch price ${formatEther(p)} ETH on ${CFG.chain.name}`;
    if (step > 0n && every > 0) t += ` · +${formatEther(step)} ETH every ${every} ${CFG.project.gifts ? "paid mints (free gifts don't count)" : 'mints'}`;
    return t;
  }
  let t = `${formatEther(p)} ETH on ${CFG.chain.name}`;
  if (step > 0n && every > 0) {
    const left = every - (Number(minted) % every);
    t += ` · rises to ${formatEther(p + step)} ETH in ${left} ${CFG.project.gifts ? 'paid ' : ''}mint${left === 1 ? '' : 's'}`;
  }
  return t;
}

async function refreshSupply() {
  if (!edition || notYet) {
    $('price').textContent = priceLabel(parseEther(CFG.project.priceEth), 0);
    return;
  }
  try {
    const [n, p, g] = await Promise.all([
      pub.readContract({ ...edition, functionName: 'totalSupply' }),
      pub.readContract({ ...edition, functionName: 'currentPrice' }),
      pub.readContract({ ...edition, functionName: 'gifted' }).catch(() => 0n),
    ]);
    $('supply').textContent = `${n} minted`;
    $('price').textContent = priceLabel(p, n - g); // gifts do not count toward the next price step
  } catch { /* supply is optional */ }
}

// EIP-6963: each installed wallet announces itself. Using this instead of window.ethereum avoids
// sending the request to a different extension than the one the visitor is looking at.
const announced = new Map();
window.addEventListener('eip6963:announceProvider', (e) => announced.set(e.detail.info.uuid, e.detail));
window.dispatchEvent(new Event('eip6963:requestProvider'));
let chosen = null;

function pickWallet() {
  const list = [...announced.values()];
  if (chosen) return Promise.resolve(chosen);
  if (list.length === 1) return Promise.resolve((chosen = list[0].provider));
  if (list.length === 0) return Promise.resolve(window.ethereum || null);
  return new Promise((resolve) => {
    const el = $('status');
    el.textContent = 'Choose your wallet: ';
    for (const w of list) {
      const b = document.createElement('button');
      b.textContent = w.info.name;
      b.style.margin = '4px 8px 0 0';
      b.onclick = () => resolve((chosen = w.provider));
      el.append(b);
    }
  });
}

async function mint() {
  await new Promise((r) => setTimeout(r, 150)); // give late wallets time to announce
  const provider = await pickWallet();
  if (!provider) return status('No wallet found. Open this page in a wallet app or install a browser wallet.');
  $('mintBtn').disabled = true;
  try {
    const wallet = createWalletClient({ chain, transport: custom(provider) });
    // A wallet that is already connected to this site answers eth_accounts at once without a prompt.
    // Asking again with eth_requestAccounts can sit unanswered in some wallets, so only ask when needed.
    let [account] = await wallet.getAddresses().catch(() => []);
    if (!account) {
      status('Connecting… approve the connection in your wallet (open the wallet if nothing appears).');
      const slow = setTimeout(() => status('Still waiting for the wallet. Open it and look for a pending request, or reload this page and try again.'), 20000);
      try {
        [account] = await wallet.requestAddresses();
      } finally {
        clearTimeout(slow);
      }
    }
    const current = await wallet.getChainId();
    if (current !== chain.id) {
      status(`Switching to ${chain.name}… approve it in your wallet.`);
      try {
        await wallet.switchChain({ id: chain.id });
      } catch (e) {
        // 4902: the wallet does not know this network yet, so offer to add it.
        if (e.code !== 4902 && e.cause?.code !== 4902 && !/Unrecognized chain|4902/i.test(e.message || '')) throw e;
        status(`Adding ${chain.name} to your wallet… approve it in your wallet.`);
        await wallet.addChain({ chain });
        await wallet.switchChain({ id: chain.id });
      }
    }
    let data = 0n;
    if (mode === 'perSeed') {
      if (!shownTx) return status('Preview a real, unclaimed transaction first.');
      data = BigInt(shownTx);
    }
    if (mode === 'perMinter') {
      if (await pub.readContract({ ...edition, functionName: 'minted', args: [account] })) {
        return status('This wallet has already minted.');
      }
      $('address').value = account;
      data = await previewAddress(account);
    }
    const value = await pub.readContract({ ...edition, functionName: 'currentPrice' });
    status('Confirm in your wallet…');
    const hash = await wallet.writeContract({ ...edition, account, functionName: 'mint', args: [data], value });
    status('Waiting for confirmation…');
    await pub.waitForTransactionReceipt({ hash });
    status('Minted.', CFG.chain.explorer && { href: `${CFG.chain.explorer}/tx/${hash}`, text: 'View transaction' });
    refreshSupply();
  } catch (e) {
    status(`Mint failed: ${e.shortMessage || e.message}`);
  } finally {
    $('mintBtn').disabled = false;
  }
}

function save() {
  const img = $('art');
  const canvas = document.createElement('canvas');
  canvas.width = 960;
  canvas.height = 1080;
  canvas.getContext('2d').drawImage(img, 0, 0, 960, 1080);
  canvas.toBlob((blob) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${CFG.project.slug}.png`;
    a.click();
    URL.revokeObjectURL(a.href);
  });
}

function share() {
  const text = (mode === 'perMinter' && shown) || (mode === 'perSeed' && shownTx) ? `My ${CFG.project.name}` : CFG.project.name;
  const mention = CFG.handle ? ` via @${CFG.handle}` : '';
  const url = `https://x.com/intent/post?text=${encodeURIComponent(text + mention)}&url=${encodeURIComponent(location.href)}`;
  window.open(url, '_blank', 'noopener');
}

$('name').textContent = CFG.project.name;
$('desc').textContent = CFG.project.description;
if (CFG.testnet) $('testBanner').hidden = false;
if (CFG.author) {
  $('byline').textContent = CFG.author;
  $('byline').hidden = false;
}
if ((!edition || notYet) && CFG.project.launch) {
  $('launchNote').textContent = CFG.project.launch.note;
  $('launchNote').hidden = false;
  $('mintBtn').textContent = CFG.project.launch.button;
}
if ((!edition || notYet) && CFG.project.giftNote) {
  $('giftNote').textContent = CFG.project.giftNote;
  $('giftNote').hidden = false;
}
if (mode === 'perSeed') {
  $('addressRow').hidden = false;
  $('address').placeholder = '0x… transaction hash';
  $('address').setAttribute('aria-label', 'Transaction hash');
  $('previewBtn').onclick = () => previewTx($('address').value.trim()).catch((e) => status(`Preview failed: ${e.message}`));
  $('address').onkeydown = (e) => { if (e.key === 'Enter') $('previewBtn').click(); }; // a handler that returns false would block every other key
}
// Selecting the whole field on focus means a paste replaces the old value instead of appending to it.
// Clicking a field that still shows the last previewed value selects it too (the focus event does not fire again).
$('address').addEventListener('focus', () => $('address').select());
$('address').addEventListener('click', () => {
  const v = $('address').value;
  if (v && (v === shown || v === shownTx || new URLSearchParams(location.search).has('tx'))) $('address').select();
});
if (mode === 'perMinter') {
  $('addressRow').hidden = false;
  $('previewBtn').onclick = () => previewAddress($('address').value.trim()).catch((e) => status(`Preview failed: ${e.message}`));
  $('address').onkeydown = (e) => { if (e.key === 'Enter') $('previewBtn').click(); }; // a handler that returns false would block every other key
}
if (mode === 'perMint') {
  $('againBtn').hidden = false;
  $('againBtn').onclick = preview;
}
if (edition && !notYet) {
  $('mintBtn').disabled = false;
  $('mintBtn').textContent = 'Mint';
  $('mintBtn').onclick = mint;
} else if (edition && notYet) {
  // Reload the page by itself at launch so the button turns on without a manual refresh.
  const wait = Date.parse(CFG.project.launchAt) - Date.now() + 2000;
  if (wait < 2 ** 31 - 1) setTimeout(() => location.reload(), wait);
}
$('saveBtn').onclick = save;
$('shareBtn').onclick = share;
preview();
refreshSupply();
</script>
</body>
</html>
