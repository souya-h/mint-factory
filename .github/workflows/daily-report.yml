name: daily-report
# Each report pushed to reports/ is opened as an issue by github-actions[bot], so GitHub notifies the
# owner by email and in the GitHub app (it does not notify people about issues they open themselves).
on:
  push:
    branches: [main]
    paths: ["reports/*.md"]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Open an issue for each new report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'reports/*.md' || true)
          for f in $files; do
            title=$(head -n 1 "$f" | sed 's/^# *//')
            gh issue create --repo "${{ github.repository }}" --title "$title" --body-file "$f"
          done
