name: site
on:
  push:
    branches: [main]
    paths: ["projects/**", "deployments/**", "site/**", "config.json", "contracts/**", "scripts/build-site.js", "lib/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: pages
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Japanese font for preview cards
        run: sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
      - run: node scripts/build-site.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
