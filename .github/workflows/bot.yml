name: bot
on:
  schedule:
    - cron: "17 * * * *"  # hourly; posting hours are set per project in projects/*.json (slotsUTC)
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: bot
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Japanese font for rendered images
        run: sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
      - run: node bot/run.js
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          PAYOUT_ADDRESS: ${{ secrets.PAYOUT_ADDRESS }}
          RPC_URL: ${{ secrets.RPC_URL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      - name: Save state
        if: always()
        run: |
          git config user.name "mint-factory-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json metrics deployments
          [ -d queue ] && git add queue
          if ! git diff --cached --quiet; then
            if ! git diff --cached --quiet -- deployments; then echo "rebuild=1" >> "$GITHUB_ENV"; fi
            git commit -m "bot: update state" && git push
          fi
      - name: Rebuild site after a new deployment
        if: env.rebuild == '1'
        run: gh workflow run pages.yml
        env:
          GH_TOKEN: ${{ github.token }}
      # GitHub's cron trigger is unreliable for this repository, so each run also schedules the next one:
      # it waits until minute 17 of the next hour and dispatches this workflow again. The chain is skipped
      # if another bot run is already queued or running, so cron runs and chained runs never multiply.
      - name: Schedule next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%s)
          next=$(( (now / 3600 + 1) * 3600 + 17 * 60 ))
          sleep $(( next - now ))
          others=$(gh api "repos/${{ github.repository }}/actions/workflows/bot.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select((.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending") and .id != ${{ github.run_id }})] | length')
          if [ "$others" = "0" ]; then
            gh workflow run bot.yml --ref main
          else
            echo "another bot run is pending; not chaining"
          fi
